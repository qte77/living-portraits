# ci.yaml -- run the onboarding chain a stranger is promised, on every change.
#
# AGENTS.md tells a contributor exactly how to verify a change:
#
#     python -m pytest tests/ -q          # the count must not go down
#     python scripts/seed_demo_media.py
#     python runtime/video_graph.py build # zero walk-safety errors
#     python scripts/export_context_view.py
#
# That is a CI job written in prose. This is the same four commands, plus the
# one assertion AGENTS.md makes that no machine was making: "the count must not
# go down, and a test that flipped from pass to skip is a regression wearing a
# disguise." A human cannot hold 344 test outcomes in their head between two
# branches; the counts below are checked, not eyeballed.
#
# It runs on Linux, which the wall host is not. That is deliberate and it is the
# point: the render path is exercised headless through clip_player.DummySurface,
# so if this job is green the claim "you do not need our art, our GPU, or our
# hardware" is true on a box nobody involved in the project has ever touched.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: suite + graph chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      # 3.13 is what the suite is actually run on. The tree uses
      # `from __future__ import annotations` throughout and no version-specific
      # stdlib, so 3.10 is claimed to work -- this job is what turns that claim
      # from an inspection into a test result.
      - name: Set up Python
        run: uv python install 3.13

      # uv.lock is the exact resolution the wall host gets, win32 markers
      # included. `uv sync` installs from it; pyproject.toml stays the contract.
      # --extra dev pulls in pytest (and ruff, unused by this job but harmless)
      # from the dev optional-dependency group -- core alone has no test runner.
      - name: Install dependencies
        run: uv sync --extra dev

      # opencv-python needs libGL, which no headless runner has. Without this
      # the cv2-dependent tests skip correctly (they no longer error -- see
      # tests/test_verify.py) but 40 of them would not RUN, and the QA gate in
      # pipeline/verify.py is exactly what we want a machine to check.
      - name: Install libGL for opencv
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libglib2.0-0

      # opentelemetry-sdk is NOT a pyproject.toml dependency and is not needed to run
      # the system -- director/otel.py is fail-open by design. It is installed
      # here only so the otel tests execute rather than skip, which is the
      # difference between the documented 304/40 and a bare clone's 303/41.
      - name: Install optional test dependencies
        run: uv pip install opentelemetry-sdk

      - name: Run the suite
        run: |
          uv run python -m pytest tests/ -q --junitxml=results.xml

      # The assertion AGENTS.md makes in prose. A test that flipped from pass to
      # skip is a regression wearing a disguise, and it is invisible in a green
      # checkmark -- the run "passes" either way. So both numbers are floors.
      - name: Assert the counts did not go down
        run: |
          uv run python - <<'PY'
          import sys, xml.etree.ElementTree as ET

          # Floors, not pins -- raise these when the suite genuinely grows.
          MIN_PASSED = 304
          MAX_SKIPPED = 40

          s = ET.parse("results.xml").getroot().find("testsuite")
          total = int(s.get("tests")); skipped = int(s.get("skipped"))
          failures = int(s.get("failures")); errors = int(s.get("errors"))
          passed = total - skipped - failures - errors

          print(f"{passed} passed, {skipped} skipped, {failures} failed, {errors} errored")

          bad = []
          if failures or errors:
              bad.append(f"{failures} failed / {errors} errored")
          if passed < MIN_PASSED:
              bad.append(f"passed went DOWN: {passed} < {MIN_PASSED}")
          if skipped > MAX_SKIPPED:
              bad.append(
                  f"skipped went UP: {skipped} > {MAX_SKIPPED} -- a test that "
                  f"flipped from pass to skip is a regression wearing a disguise"
              )
          if bad:
              sys.exit("FAIL: " + "; ".join(bad))
          print("counts OK")
          PY

      # data/ is gitignored and mostly absent by design, so a fresh clone has no
      # media and build() would correctly refuse to save a graph with no edges.
      # The seeder is what makes a bare checkout walkable.
      - name: Seed placeholder media
        run: uv run python scripts/seed_demo_media.py

      # build() refusing to write is CORRECT behaviour when a pose would be
      # stranded or trapped. A non-zero exit here means the graph genuinely
      # cannot be walked -- never "relax the check".
      - name: Build the video graph
        run: uv run python runtime/video_graph.py build

      - name: Export the context view
        run: uv run python scripts/export_context_view.py

      # The viewer's codemap is checked against disk: every row carries
      # exists: true/false, and nothing asserted it. A moved file degrades the
      # viewer silently rather than failing anything, which is how it stays
      # broken. This is that assertion.
      - name: Assert the codemap still resolves
        run: |
          uv run python - <<'PY'
          import json, sys
          d = json.load(open("data/graph/context_view.json"))
          missing = [r["path"] for r in d["codemap"] if not r.get("exists")]
          print(f"{len(d['nodes'])} nodes, {len(d['edges'])} edges, "
                f"{len(d['codemap'])} codemap rows, {len(missing)} missing")
          if missing:
              sys.exit("codemap rows point at files that are not on disk: "
                       + ", ".join(missing))
          PY

      # The dual-panel stage, rendered headless through the same numpy
      # compositor the wall uses. Proves the render path, not just the graph.
      - name: Render the panels headless
        run: uv run python runtime/capture_demo.py --selftest

  degraded:
    name: degrades without cv2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      # Deliberately WITHOUT opencv and WITHOUT libGL: this job exists to prove
      # AGENTS.md rule 4 -- absence is a skip with a reason, never a pass and
      # never an error. It regression-guards the failure this job was written
      # for: tests/test_verify.py used to abort collection here, taking the
      # whole session down and running zero tests while looking like one
      # broken file.
      - name: Install without opencv
        run: |
          uv venv
          uv pip install numpy PyYAML pillow imageio pytest

      - name: Suite must still run and still skip cleanly
        run: |
          uv run python -m pytest tests/ -q --junitxml=results.xml

      - name: Assert it skipped rather than errored
        run: |
          uv run python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          s = ET.parse("results.xml").getroot().find("testsuite")
          total = int(s.get("tests")); skipped = int(s.get("skipped"))
          failures = int(s.get("failures")); errors = int(s.get("errors"))
          passed = total - skipped - failures - errors
          print(f"{passed} passed, {skipped} skipped, {failures} failed, {errors} errored")
          if errors or failures:
              sys.exit("a missing dependency must SKIP, not error -- AGENTS.md rule 4")
          if passed < 200:
              sys.exit(f"only {passed} tests ran without cv2; the suite is not "
                       f"degrading, it is collapsing")
          print("degradation OK")
          PY

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      # Ruff is the single Python linter here (see pyproject.toml's [tool.ruff]
      # header for why pylint was not adopted). This gate is green as of the
      # ruff migration, so it BLOCKS -- a new finding is a failure, not a note.
      # Findings that are real but not yet fixed live in the FOLLOW-UP block of
      # [tool.ruff.lint].ignore with counts, so they cannot grow silently while
      # the gate stays green.
      - name: Lint
        run: uvx ruff@0.16.6 check runtime director scripts health tests gallery.py player.py pipeline _preview_graph.py

      - name: Formatting drift (advisory)
        continue-on-error: true
        run: uvx ruff@0.16.6 format --diff runtime director scripts health pipeline _preview_graph.py

  security:
    name: security scan (bandit + pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      # Static analysis for security-relevant patterns (injection, unsafe
      # deserialization, weak crypto, etc). pyproject.toml's
      # [tool.ruff.lint].ignore already documents several deliberate,
      # AGENTS.md-backed exemptions bandit doesn't know about -- S101 asserts,
      # S311 non-crypto random, S603/S607 subprocess, S310 urlopen, PTH105 --
      # so this step will re-flag some of the same lines on purpose. That is
      # expected, not a regression, and not something this step tries to
      # silence. Non-blocking for now: a first pass reports findings for
      # triage rather than failing CI on day one, the same way the formatting
      # step above is advisory.
      - name: Bandit (advisory)
        continue-on-error: true
        run: uvx bandit@1.9.4 -r runtime director pipeline scripts health

      # requirements-gen.txt's CUDA/torch stack (pyproject.toml's `gen`
      # extra) is unpinned on purpose -- its own comment explains why a pin
      # would be a pin for one machine -- so it has nothing meaningful to
      # audit and is excluded here. This exports only the core dependencies
      # plus the `dev` extra that CI actually installs.
      - name: Export locked dependencies (core + dev, no gen extra)
        run: uv export --extra dev --no-hashes -o requirements-audit.txt

      # Known-vulnerability check against the exact pins in uv.lock.
      # Non-blocking for now, same reasoning as the bandit step above.
      - name: pip-audit (advisory)
        continue-on-error: true
        run: uvx pip-audit@2.10.1 -r requirements-audit.txt
